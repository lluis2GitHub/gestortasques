{% extends "base.html" %}
{% load form_filters %}

{% block title %}Eliminar nota{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">

    <div class="card shadow-sm p-4 text-center" style="width: 420px;">

        <h2 class="mb-3 text-danger">
            <i class="bi bi-exclamation-triangle"></i> Eliminar tasca
        </h2>
        <p class="mb-4">
            Segur que vols eliminar la tasca <strong>{{ tasca.titol }}</strong>?
        </p>
        <form method="POST" class="mb-3">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger w-100">
                <i class="bi bi-trash"></i> Sí, eliminar
            </button>
        </form>
        <a href="{% url 'tasques:editar_tasca' nota.tasca.id %}" class="btn btn-secondary w-100">
            <i class="bi bi-arrow-left"></i> Cancel·lar
        </a>
    </div>

</div>
{% endblock %}
