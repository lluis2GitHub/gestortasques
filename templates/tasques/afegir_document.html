{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <!-- Capçalera -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold">
            <i class="bi bi-paperclip"></i> Afegir document a la nota {{ nota.id }}
        </h2>
        <a href="{% url 'tasques:editar_tasca' nota.tasca.id %}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Tornar a la tasca
        </a>
    </div>

    <!-- Targeta del formulari -->
    <div class="card shadow-sm">
        <div class="card-body">

            <form method="post" enctype="multipart/form-data"
                  action="{% url 'tasques:afegir_document' nota.id %}">
                {% csrf_token %}

                <!-- Fitxer -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-upload"></i> Adjunta un document
                    </label>
                    {{ form.fitxer }}
                </div>

                <!-- Títol -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-type"></i> Títol
                    </label>
                    {{ form.nom }}
                </div>

                <!-- Descripció -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-card-text"></i> Descripció
                    </label>
                    {{ form.descripcio }}
                </div>

                <!-- Botó desar -->
                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="bi bi-save"></i> Desar document
                </button>

            </form>

        </div>
    </div>

</div>

{% endblock %}
