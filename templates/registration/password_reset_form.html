{% extends "base.html" %}
{% block title %}Recuperar contrasenya{% endblock %}

{% block content %}
<h1>Recuperar contrasenya</h1>

<p>Introdueix el teu correu electrònic i t'enviarem instruccions.</p>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Enviar instruccions</button>
</form>

<div class="help">
    <a href="/accounts/login/">Tornar al login</a>
</div>
{% endblock %}
