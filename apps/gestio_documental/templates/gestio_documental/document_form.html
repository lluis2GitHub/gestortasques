<!-- Botó per obrir el modal -->
<button id="openDocumentModal" class="btn-primary">Afegir document</button>

<!-- Finestra modal -->
<div id="documentModal" class="modal">
    <div class="modal-content">
        <span id="closeDocumentModal" class="close">&times;</span>

        <h2>Nou document</h2>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-primary">Desar</button>
        </form>
    </div>
</div>

<!-- CSS del modal -->
<style>
.modal {
    display: none;
    position: fixed;
    z-index: 9999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
}

.modal-content {
    background: #fff;
    margin: 8% auto;
    padding: 24px;
    border-radius: 8px;
    width: 500px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.close {
    float: right;
    font-size: 28px;
    cursor: pointer;
    font-weight: bold;
}
.close:hover {
    color: #d00;
}

.btn-primary {
    background: #2a6ee8;
    color: white;
    padding: 10px 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
}
.btn-primary:hover {
    background: #1f56b8;
}
</style>

<!-- JS per obrir i tancar el modal -->
<script>
    const modal = document.getElementById("documentModal");
    const openBtn = document.getElementById("openDocumentModal");
    const closeBtn = document.getElementById("closeDocumentModal");

    openBtn.onclick = () => modal.style.display = "block";
    closeBtn.onclick = () => modal.style.display = "none";

    window.onclick = (event) => {
        if (event.target === modal) {
            modal.style.display = "none";
        }
    };
</script>
